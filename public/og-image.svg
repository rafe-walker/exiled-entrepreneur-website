<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Exiled Entrepreneur — Technical income from a dead zone">
  <title>The Exiled Entrepreneur — Technical income from a dead zone</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="55%" stop-color="#15110d"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- horizon line: desert at night -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#d4a853" stroke-opacity="0.18" stroke-width="1"/>
  <!-- simplified container + solar silhouette -->
  <g transform="translate(860, 392)" fill="none" stroke="#d4a853" stroke-opacity="0.55" stroke-width="2">
    <rect x="0" y="48" width="220" height="60" rx="2"/>
    <line x1="0" y1="66" x2="220" y2="66"/>
    <line x1="0" y1="90" x2="220" y2="90"/>
    <rect x="12" y="108" width="10" height="16"/>
    <rect x="198" y="108" width="10" height="16"/>
    <!-- ground-mount array -->
    <polygon points="250,70 330,54 330,96 250,112"/>
    <line x1="290" y1="62" x2="290" y2="104"/>
    <line x1="250" y1="91" x2="330" y2="75"/>
    <line x1="290" y1="104" x2="290" y2="124"/>
  </g>

  <!-- flame mark -->
  <g transform="translate(72, 78) scale(1.15)" fill="#d4a853">
    <path d="M 24 44 C 24 44 8 36 8 22 C 8 14 14 8 20 6 C 18 10 20 14 24 16 C 22 12 26 8 30 6 C 28 12 32 16 36 20 C 38 16 36 10 32 6 C 40 10 44 18 44 26 C 44 36 36 44 28 46 C 26 44 24 44 24 44 Z"/>
  </g>
  <text x="140" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#d4a853" letter-spacing="7">THE EXILED ENTREPRENEUR</text>

  <!-- headline -->
  <text x="72" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="900" fill="#f5f0e8" letter-spacing="-2">Technical income</text>
  <text x="72" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="900" fill="url(#gold)" letter-spacing="-2">from a dead zone.</text>

  <rect x="72" y="392" width="480" height="2" fill="#d4a853" opacity="0.6"/>

  <text x="72" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#b8a98e">Off-grid power · Rural connectivity · Owner-built container home</text>
  <text x="72" y="476" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#b8a98e">Income that doesn't care where you live</text>

  <text x="72" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#d4a853" font-weight="600">theexiledentrepreneur.com</text>
  <text x="1128" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#6b6356" text-anchor="end" letter-spacing="2">COCHISE COUNTY, AZ</text>

  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#d4a853" stroke-width="1.5" stroke-opacity="0.22" rx="4"/>
</svg>
